<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salus — what customers signal, and what to settle</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --faint: #6e6e6e;
      --line: #e4e4e4;
      --fill: #f6f6f6;
      --fill-2: #efefef;
      --accent: #1d6fd4;
      --on-accent: #ffffff;
      --info: #1d6fd4;
      --warning: #8a6408;
      --danger: #b42318;
      --track: #ececec;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
    }
    h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p { margin: 0 0 12px; }
    .lede, .note, caption, .source {
      color: var(--muted);
      font-size: 14px;
    }
    .source { font-size: 12px; color: var(--faint); margin-top: 8px; }
    .callout {
      border: 1px solid var(--line);
      border-left-width: 3px;
      background: var(--fill);
      padding: 14px 16px;
      margin: 20px 0;
    }
    .callout.warning { border-left-color: var(--warning); }
    .callout.danger { border-left-color: var(--danger); }
    .callout strong { display: block; margin-bottom: 4px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 20px 0 8px;
    }
    .stat .value {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .stat .value.warning { color: var(--warning); }
    .stat .value.danger { color: var(--danger); }
    .stat .label { color: var(--muted); font-size: 13px; margin-top: 4px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(140px, 180px) 1fr 40px;
      gap: 8px;
      align-items: center;
      margin: 0 0 8px;
      font-size: 13px;
    }
    .bar-label { color: var(--text); }
    .bar-track { height: 8px; background: var(--track); }
    .bar-fill { height: 8px; }
    .bar-fill.info { background: var(--info); }
    .bar-fill.warning { background: var(--warning); }
    .bar-value { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
    button.pill {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      padding: 4px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button.pill[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }
    .table-wrap { overflow: auto; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
    th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; background: var(--fill); position: sticky; top: 0; }
    tbody tr:nth-child(even) { background: var(--fill); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .dot.danger { background: var(--danger); }
    .dot.warning { background: var(--warning); }
    .dot.info { background: var(--info); }
    .when { white-space: nowrap; }
    a { color: var(--accent); }
    @media (max-width: 800px) {
      .stats, .grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 2px; margin-bottom: 14px; }
      .bar-value { text-align: left; }
    }
  
    .gate { max-width: 420px; margin: 18vh auto 0; padding: 0 24px; }
    .gate h1 { margin-bottom: 8px; }
    .gate form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
    .gate label { flex: 0 0 100%; }
    .gate input { flex: 1; min-width: 180px; border: 1px solid var(--line); background: #fff; color: var(--text); font: inherit; padding: 8px 10px; }
    .gate button { border: 0; background: var(--accent); color: var(--on-accent); font: inherit; padding: 8px 14px; cursor: pointer; }
    .gate .error { color: var(--danger); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="gate">
    <h1>Salus</h1>
    <p class="lede">Enter the password to view the brief.</p>
    <form id="gate-form">
      <label class="source" for="gate-password">Password</label>
      <input id="gate-password" type="password" autocomplete="current-password" required>
      <button type="submit">Continue</button>
    </form>
    <p class="error" id="gate-error" hidden>That password is not correct.</p>
  </main>

    function b64ToBytes(value) {
      const bin = atob(value);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function unlock(password) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plainBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(payload.iv) },
        key,
        b64ToBytes(payload.data)
      );
      return new TextDecoder().decode(plainBuffer);
    }

    document.getElementById("gate-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const error = document.getElementById("gate-error");
      error.hidden = true;
      try {
        const html = await unlock(document.getElementById("gate-password").value);
        const template = document.createElement("template");
        template.innerHTML = html;
        const scripts = Array.from(template.content.querySelectorAll("script"));
        scripts.forEach(function (script) { script.remove(); });
        document.body.replaceChildren(template.content);
        scripts.forEach(function (oldScript) {
          const script = document.createElement("script");
          script.textContent = oldScript.textContent;
          document.body.appendChild(script);
        });
      } catch (err) {
        error.hidden = false;
      }
    });
  </script>
